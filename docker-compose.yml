services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ta_paperless
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    image: node:20
    working_dir: /app
    volumes:
      - ./db:/app
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: secret
      DB_DATABASE: ta_paperless
      DB_DATABASE_TEST: ta_paperless_test
    command: sh -c "npm install && npm run migrate"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
